<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCar · Arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · MyCar (Android)</p>
    <h1>Activities y acceso directo a SQLite en MyCar</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Arquitectura de la app Android MyCar</title>
      <desc id="architecture-desc">Diagrama de arquitectura que muestra las pantallas (Activities) de la app y cómo, sin capa de repositorio ni MVVM, ResumenActivity escribe y ListaAlquileresActivity lee directamente de la base de datos SQLite local (tabla alquileres). El catálogo de vehículos usa datos hardcodeados, sin backend.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn before boxes) -->
      <!-- MainActivity fan-out to the three menu destinations -->
      <path d="M 490,84 H 333 Q 325,84 325,92 V 112 Q 325,120 317,120 H 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="490" y1="84" x2="490" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 490,84 H 647 Q 655,84 655,92 V 112 Q 655,120 663,120 H 820" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Catálogo browsing sequence (left column, straight verticals) -->
      <line x1="160" y1="164" x2="160" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="274" x2="160" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="364" x2="160" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ResumenActivity -> SQLite (write, focal) -->
      <path d="M 160,454 H 317 Q 325,454 325,462 V 492 Q 325,500 333,500 H 480" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- ListaAlquileresActivity -> SQLite (read, long straight vertical) -->
      <line x1="490" y1="164" x2="490" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="290" y="470" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="313" y="479" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCRIBE</text>

      <rect x="466" y="320" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="486" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEE</text>

      <!-- Node: MainActivity (entry point) -->
      <rect x="390" y="30" width="200" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MainActivity</text>
      <text x="490" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Menú principal</text>

      <!-- Node: ListaActivity -->
      <rect x="60" y="120" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ListaActivity</text>
      <text x="160" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Categorías / marcas</text>

      <!-- Node: ListaAlquileresActivity -->
      <rect x="390" y="120" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ListaAlquileresActivity</text>
      <text x="490" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Historial de alquileres</text>

      <!-- Node: InformacionActivity (standalone leaf) -->
      <rect x="720" y="120" width="200" height="44" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="820" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">InformacionActivity</text>
      <text x="820" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Acerca de la app</text>

      <!-- Node: Catálogo (VehiculosActivity + DetalleActivity, hardcoded data) -->
      <rect x="60" y="220" width="200" height="54" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="160" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Catálogo</text>
      <text x="160" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">VehiculosActivity · DetalleActivity</text>
      <text x="160" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">datos hardcodeados, sin API</text>

      <!-- Node: AlquilerActivity -->
      <rect x="60" y="320" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AlquilerActivity</text>
      <text x="160" y="355" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Formulario + validaciones</text>

      <!-- Node: ResumenActivity -->
      <rect x="60" y="410" width="200" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ResumenActivity</text>
      <text x="160" y="445" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Resumen + confirmación</text>

      <!-- Node: SQLite (alquileres) — focal, the store every path converges on -->
      <rect x="380" y="500" width="220" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="506" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="408" y="515" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQLITE</text>
      <text x="490" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">alquileres</text>
      <text x="490" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AdminSQLiteOpenHelper</text>

      <!-- Legend -->
      <line x1="40" y1="578" x2="920" y2="578" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="700" y="580" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="720" y="589" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Foco: almacén de datos</text>
    </svg>
  </div>
</body>
</html>
